        function formatMinutesToHours(min) {
            if (min >= 60) {
                const h = Math.floor(min / 60);
                const m = min % 60;
                return `${h}시간 ${m}분`;
            }
            return `${min}분`;
        }

        function renderStatsDashboard() {
            const today = new Date();
            const last30DaysKeys = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                last30DaysKeys.push(getDateKey(d));
            }

            let activeDaysCount = 0;
            let totalFocusSec30Days = 0;
            let hourlyTotals30Days = new Array(24).fill(0); 

            last30DaysKeys.forEach(dateKey => {
                const dayData = focusHistory[dateKey];
                if (dayData) {
                    const daySec = dayData.totalSeconds || 0;
                    if (daySec >= 300) {
                        activeDaysCount++;
                        totalFocusSec30Days += daySec;
                    }
                    const arr = dayData.hourly || [];
                    for (let h = 0; h < 24; h++) {
                        hourlyTotals30Days[h] += (arr[h] || 0);
                    }
                }
            });

            document.getElementById('stats-active-days-val').textContent = `${activeDaysCount}일`;
            const avgSec = activeDaysCount > 0 ? (totalFocusSec30Days / activeDaysCount) : 0;
            const avgMin = Math.floor(avgSec / 60);
            if (avgMin >= 60) {
                const h = Math.floor(avgMin / 60);
                const m = avgMin % 60;
                document.getElementById('stats-daily-avg-val').textContent = `${h}h ${m}m`;
            } else {
                document.getElementById('stats-daily-avg-val').textContent = `${avgMin}m`;
            }

            renderLineActivityChart();
            renderHourlyDistributionChart(hourlyTotals30Days);
        }

        function renderLineActivityChart() {
            const svg = document.getElementById('line-chart-svg');
            const axisLabelsContainer = document.getElementById('line-axis-labels-container');
            svg.innerHTML = '';
            axisLabelsContainer.innerHTML = '';

            const days = currentChartRange;
            const today = new Date();
            const dateList = [];
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

            for (let i = days - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const m = d.getMonth() + 1;
                const dayNum = d.getDate();
                const w = weekdays[d.getDay()];
                dateList.push({
                    dateKey: getDateKey(d),
                    dayNumber: String(dayNum),
                    tooltipDateStr: `${m}/${dayNum}(${w})`
                });
            }

            let maxSeconds = 60;
            dateList.forEach(item => {
                const sec = (focusHistory[item.dateKey] && focusHistory[item.dateKey].totalSeconds) || 0;
                if (sec > maxSeconds) maxSeconds = sec;
            });

            const svgWidth = svg.clientWidth || 380;
            const svgHeight = 105;
            const padLeft = 14;
            const padRight = 14;
            const padTop = 15;
            const padBottom = 15;
            const chartW = svgWidth - padLeft - padRight;
            const chartH = svgHeight - padTop - padBottom;

            const points = dateList.map((item, idx) => {
                const sec = (focusHistory[item.dateKey] && focusHistory[item.dateKey].totalSeconds) || 0;
                const x = padLeft + (chartW / (days - 1)) * idx;
                const y = padTop + chartH - (sec / maxSeconds) * chartH;
                return { x, y, item, sec };
            });

            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            const linearGrad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
            linearGrad.setAttribute("id", "lineAreaGrad");
            linearGrad.setAttribute("x1", "0%");
            linearGrad.setAttribute("y1", "0%");
            linearGrad.setAttribute("x2", "0%");
            linearGrad.setAttribute("y2", "100%");

            const stop1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop1.setAttribute("offset", "0%");
            stop1.setAttribute("stop-color", "#6A55C9");
            stop1.setAttribute("stop-opacity", "0.38");

            const stop2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop2.setAttribute("offset", "100%");
            stop2.setAttribute("stop-color", "#6A55C9");
            stop2.setAttribute("stop-opacity", "0.0");

            linearGrad.appendChild(stop1);
            linearGrad.appendChild(stop2);
            defs.appendChild(linearGrad);
            svg.appendChild(defs);

            let lineD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                lineD += ` L ${points[i].x} ${points[i].y}`;
            }

            const bottomY = padTop + chartH;
            const areaD = `${lineD} L ${points[points.length - 1].x} ${bottomY} L ${points[0].x} ${bottomY} Z`;

            const areaEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
            areaEl.setAttribute("d", areaD);
            areaEl.setAttribute("fill", "url(#lineAreaGrad)");
            svg.appendChild(areaEl);

            const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathEl.setAttribute("d", lineD);
            pathEl.setAttribute("fill", "none");
            pathEl.setAttribute("stroke", "#6A55C9");
            pathEl.setAttribute("stroke-width", "2.8");
            pathEl.setAttribute("stroke-linejoin", "round");
            svg.appendChild(pathEl);

            points.forEach(pt => {
                const hitCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                hitCircle.setAttribute("cx", pt.x);
                hitCircle.setAttribute("cy", pt.y);
                hitCircle.setAttribute("r", "12");
                hitCircle.setAttribute("fill", "transparent");
                hitCircle.style.cursor = "pointer";

                const min = Math.floor(pt.sec / 60);
                const tooltipText = `${pt.item.tooltipDateStr}: ${formatMinutesToHours(min)}`;

                const triggerEvent = (e) => {
                    e.stopPropagation();
                    showTooltip(e, tooltipText);
                };

                hitCircle.addEventListener('mouseenter', (e) => showTooltip(e, tooltipText));
                hitCircle.addEventListener('mousemove', (e) => positionTooltip(e));
                hitCircle.addEventListener('click', triggerEvent);
                hitCircle.addEventListener('touchstart', triggerEvent);

                svg.appendChild(hitCircle);
            });

            if (days === 7) {
                points.forEach(pt => {
                    const span = document.createElement('span');
                    span.className = 'chart-axis-label-item';
                    span.textContent = pt.item.dayNumber;
                    span.style.left = `${(pt.x / svgWidth) * 100}%`;
                    axisLabelsContainer.appendChild(span);
                });
            } else {
                points.forEach((pt, idx) => {
                    if (idx % 5 === 0 || idx === points.length - 1) {
                        const span = document.createElement('span');
                        span.className = 'chart-axis-label-item';
                        span.textContent = pt.item.dayNumber;
                        span.style.left = `${(pt.x / svgWidth) * 100}%`;
                        axisLabelsContainer.appendChild(span);
                    }
                });
            }
        }

        function renderHourlyDistributionChart(hourlyTotals30Days) {
            const hourlyBox = document.getElementById('hourly-chart-box');
            hourlyBox.innerHTML = '';

            const maxHourlySec = Math.max(60, ...hourlyTotals30Days);

            for (let h = 0; h < 24; h++) {
                const sec = hourlyTotals30Days[h];
                const min = Math.floor(sec / 60);
                const col = document.createElement('div');
                col.className = 'hourly-bar-col';

                const bar = document.createElement('div');
                bar.className = `hourly-bar ${sec === 0 ? 'empty' : ''}`;
                const heightPct = Math.max(3, (sec / maxHourlySec) * 95);
                bar.style.height = `${heightPct}%`;

                const tooltipText = `${h}시 ~ ${h + 1}시: 총 ${formatMinutesToHours(min)}`;

                const triggerEvent = (e) => {
                    e.stopPropagation();
                    showTooltip(e, tooltipText);
                };

                col.addEventListener('mouseenter', (e) => showTooltip(e, tooltipText));
                col.addEventListener('mousemove', (e) => positionTooltip(e));
                col.addEventListener('click', triggerEvent);
                col.addEventListener('touchstart', triggerEvent);

                col.appendChild(bar);
                hourlyBox.appendChild(col);
            }
        }

        /* [실시간 고스트 커스텀 드래그 앤 드롭] */
        let draggedTodoId = null;
        let dragGhost = null;
        let offsetX = 0;
        let offsetY = 0;

        function handlePointerDown(e, id, itemEl) {
            if (e.type.startsWith('mouse') && e.button !== 0) return;
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();
            
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'INPUT')) {
                activeEl.blur();
            }

            draggedTodoId = id;
            const rect = itemEl.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;

            itemEl.classList.add('is-placeholder');

            dragGhost = itemEl.cloneNode(true);
            dragGhost.classList.remove('is-placeholder');
            dragGhost.classList.add('is-dragging-ghost');
            dragGhost.style.width = `${rect.width}px`;
            dragGhost.style.height = `${rect.height}px`;
            dragGhost.style.left = `${clientX - offsetX}px`;
            dragGhost.style.top = `${clientY - offsetY}px`;
            document.body.appendChild(dragGhost);

            document.addEventListener('touchmove', handlePointerMove, { passive: false });
            document.addEventListener('touchend', handlePointerUp);
            document.addEventListener('mousemove', handlePointerMove);
            document.addEventListener('mouseup', handlePointerUp);
        }

        function handlePointerMove(e) {
            if (!dragGhost) return;
            e.preventDefault(); 
            e.stopPropagation();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            dragGhost.style.left = `${clientX - offsetX}px`;
            dragGhost.style.top = `${clientY - offsetY}px`;

            document.querySelectorAll('.todo-item').forEach(el => {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            });

            dragGhost.style.display = 'none';
            const targetEl = document.elementFromPoint(clientX, clientY);
            dragGhost.style.display = 'flex';

            const dropLi = targetEl ? targetEl.closest('.todo-item:not(.is-placeholder):not(.completed)') : null;
            if (dropLi) {
                const dropRect = dropLi.getBoundingClientRect();
                if (clientY < dropRect.top + dropRect.height / 2) {
                    dropLi.classList.add('drag-over-top');
                } else {
                    dropLi.classList.add('drag-over-bottom');
                }
            }
        }

        function handlePointerUp(e) {
            if (!dragGhost) return;
            
            dragGhost.remove();
            dragGhost = null;

            const overTop = document.querySelector('.todo-item.drag-over-top');
            const overBottom = document.querySelector('.todo-item.drag-over-bottom');

            let targetId = null;
            let position = null;

            if (overTop) {
                targetId = parseFloat(overTop.dataset.id);
                position = 'before';
            } else if (overBottom) {
                targetId = parseFloat(overBottom.dataset.id);
                position = 'after';
            }

            document.querySelectorAll('.todo-item').forEach(el => {
                el.classList.remove('drag-over-top', 'drag-over-bottom', 'is-placeholder', 'is-dragging');
            });

            if (targetId && draggedTodoId) {
                reorderTodosCustom(draggedTodoId, targetId, position);
            } else {
                renderTodos();
            }

            draggedTodoId = null;
            document.removeEventListener('touchmove', handlePointerMove);
            document.removeEventListener('touchend', handlePointerUp);
            document.removeEventListener('mousemove', handlePointerMove);
            document.removeEventListener('mouseup', handlePointerUp);
        }

        function reorderTodosCustom(sourceId, targetId, position) {
            updateLastActive();
            const uncompleted = todos.filter(t => !t.completed).sort((a, b) => a.order - b.order);
            const sourceIdx = uncompleted.findIndex(t => t.id === sourceId);
            const targetIdx = uncompleted.findIndex(t => t.id === targetId);

            if (sourceIdx === -1 || targetIdx === -1) return;

            const [movedItem] = uncompleted.splice(sourceIdx, 1);
            let newTargetIdx = uncompleted.findIndex(t => t.id === targetId);

            if (position === 'after') {
                newTargetIdx++;
            }
            uncompleted.splice(newTargetIdx, 0, movedItem);

            uncompleted.forEach((item, index) => {
                item.order = index + 1;
            });

            saveState();
            renderTodos();
        }

        /* [To-Do 리스트 토글] */
        function toggleDrawer(event) {
            updateLastActive();
            if (event) {
                event.stopPropagation(); 
            }
            todoDrawer.classList.toggle('open');
            todoToggleBtn.classList.toggle('drawer-open');
        }

        /* [핵심: 투두 내부 터치/클릭이 바깥 document로 전파되어 전체화면을 건드리지 못하게 원천 봉쇄] */
        ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evtName => {
            todoDrawer.addEventListener(evtName, (e) => {
                e.stopPropagation();
            }, { passive: true });
        });

        /* 서랍 외부를 명확히 클릭했을 때만 투두 닫기 */
        document.addEventListener('click', (event) => {
            if (event.target.closest('#todo-drawer') || 
                event.target.closest('#todo-toggle-btn') || 
                event.target.closest('#fullscreen-toggle-btn') || 
                event.target.closest('.top-action-btn') || 
                event.target.closest('.bottom-action-btn') ||
                event.target.closest('.settings-modal-overlay') || 
                event.target.closest('.custom-alert-overlay')) {
                return;
            }
            if (todoDrawer && todoDrawer.classList.contains('open')) {
                todoDrawer.classList.remove('open');
                todoToggleBtn.classList.remove('drawer-open');
            }
        });

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.max(38, Math.min(textarea.scrollHeight, 80)) + 'px';
            textarea.scrollTop = 0; 
        }

        function handleTodoKeyDown(e) {
            if (e.isComposing) return;
            
            const isMobile = window.innerWidth <= 600; 
            
            if (e.key === 'Enter') {
                if (isMobile) {
                    setTimeout(() => autoResizeTextarea(e.target), 0);
                } else {
                    if (e.shiftKey) {
                        setTimeout(() => autoResizeTextarea(e.target), 0);
                    } else {
                        e.preventDefault();
                        addTodo();
                    }
                }
            }
        }

        function getSortedTodos() {
            const uncompleted = todos.filter(t => !t.completed).sort((a, b) => a.order - b.order);
            const completed = todos.filter(t => t.completed).sort((a, b) => (a.completedAt || 0) - (b.completedAt || 0));
            return [...uncompleted, ...completed];
        }

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';

            const sortedList = getSortedTodos();

            sortedList.forEach((todo) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.dataset.id = todo.id;

                const chk = document.createElement('input');
                chk.type = 'checkbox';
                chk.checked = !!todo.completed;
                chk.onchange = (e) => toggleTodo(todo.id, e);

                const span = document.createElement('span');
                span.className = 'todo-text';
                span.textContent = todo.text;

                const dragHandle = document.createElement('button');
                dragHandle.type = 'button';
                dragHandle.className = 'todo-drag-handle';
                dragHandle.title = '끌어서 순서 변경';
                dragHandle.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="7" x2="20" y2="7"/>
                        <line x1="4" y1="12" x2="20" y2="12"/>
                        <line x1="4" y1="17" x2="20" y2="17"/>
                    </svg>
                `;

                if (!todo.completed) {
                    dragHandle.addEventListener('touchstart', (e) => handlePointerDown(e, todo.id, li), { passive: false });
                    dragHandle.addEventListener('mousedown', (e) => handlePointerDown(e, todo.id, li));
                }

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'todo-del-btn';
                delBtn.title = '삭제';
                delBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="6" y1="6" x2="18" y2="18"/>
                        <line x1="18" y1="6" x2="6" y2="18"/>
                    </svg>
                `;
                delBtn.onclick = (e) => deleteTodo(todo.id, e);

                const actionWrap = document.createElement('div');
                actionWrap.className = 'todo-actions';
                
                if (!todo.completed) {
                    actionWrap.appendChild(dragHandle);
                }
                actionWrap.appendChild(delBtn);

                li.append(chk, span, actionWrap);
                list.appendChild(li);
            });
        }

        function addTodo() {
            updateLastActive();
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;

            const maxOrder = todos.reduce((max, t) => Math.max(max, t.order || 0), 0);
            todos.push({
                id: Date.now() + Math.random(),
                text: text,
                completed: false,
                order: maxOrder + 1,
                completedAt: null
            });

            input.value = '';
            input.style.height = '38px';
            if (!isFullscreenActive) {
                input.focus();
            }
            
            setTimeout(() => {
                input.scrollTop = 0;
                autoResizeTextarea(input);
            }, 0);
            
            saveState();
            renderTodos();
        }

        function toggleTodo(id, e) {
            updateLastActive();
            if (e) e.stopPropagation();
            const item = todos.find(t => t.id === id);
            if (!item) return;

            item.completed = !item.completed;
            item.completedAt = item.completed ? Date.now() : null;
            saveState();
            renderTodos();
        }

        function deleteTodo(id, e) {
            updateLastActive();
            if (e) e.stopPropagation();
            todos = todos.filter(t => t.id !== id);
            saveState();
            renderTodos();
        }

        /* [아이콘 SVG 정의] */
        const ICON_ENTER_FULLSCREEN = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/>';
        const ICON_EXIT_FULLSCREEN = `
            <path d="M4 10h3.5a1.5 1.5 0 0 0 1.5-1.5V5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 10h-3.5a1.5 1.5 0 0 1-1.5-1.5V5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 14h3.5a1.5 1.5 0 0 1 1.5 1.5V19" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 14h-3.5a1.5 1.5 0 0 0-1.5 1.5V19" stroke-linecap="round" stroke-linejoin="round"/>
        `;

        function updateFullscreenIcon(isFs) {
            fsIcon.innerHTML = isFs ? ICON_EXIT_FULLSCREEN : ICON_ENTER_FULLSCREEN;
            document.getElementById('fullscreen-toggle-btn').title = isFs ? "전체화면 종료" : "전체화면 전환";
            adjustLayoutScale();
        }

        /* [핵심: 오직 #fullscreen-toggle-btn 클릭으로만 작동/해제되는 안전 상태 머신] */
        let isFullscreenActive = false;

        function toggleFullScreen(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            updateLastActive();

            const doc = document;
            const docEl = document.documentElement;
            const isNative = !!(doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement);

            if (!isFullscreenActive) {
                // 전체화면 진입: 어떤 기기든 즉각 실행
                isFullscreenActive = true;
                updateFullscreenIcon(true);

                const reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                if (reqFs) {
                    try {
                        const p = reqFs.call(docEl);
                        if (p && p.catch) {
                            p.catch(() => {
                                document.body.classList.add('pseudo-fullscreen');
                            });
                        }
                    } catch (err) {
                        document.body.classList.add('pseudo-fullscreen');
                    }
                } else {
                    document.body.classList.add('pseudo-fullscreen');
                }
            } else {
                // 전체화면 해제: 오직 이 버튼을 눌렀을 때만 해제
                isFullscreenActive = false;
                updateFullscreenIcon(false);
                document.body.classList.remove('pseudo-fullscreen');

                if (isNative) {
                    const exitFs = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
                    if (exitFs) {
                        try {
                            const p = exitFs.call(doc);
                            if (p && p.catch) p.catch(() => {});
                        } catch (err) {}
                    }
                }
            }
        }

        /* 브라우저가 키보드 호출 등으로 네이티브 전체화면을 임의로 풀더라도 사용자가 버튼을 안 눌렀다면 UI 전체화면 상태 강제 유지 */
        function handleFsChange() {
            const isNative = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (!isNative && isFullscreenActive) {
                document.body.classList.add('pseudo-fullscreen');
                updateFullscreenIcon(true);
            }
        }

        document.addEventListener('fullscreenchange', handleFsChange);
        document.addEventListener('webkitfullscreenchange', handleFsChange);

        /* 초기 구동 */
        checkMidnightReset();
        updateDisplay();
        renderTodos();
        initCloudSync();
        adjustLayoutScale();
        updateMuteDisplay();
        renderPomoTracker();
        setTimeout(triggerShootingStar, 1500);
    </script>
</body>
</html>
