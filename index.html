        };

        let db = null;
        const isFirebaseConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
        try {
            if (isFirebaseConfigured && window.firebase) {
                firebase.initializeApp(firebaseConfig); db = firebase.firestore();
            }
        } catch (e) { console.warn('Firebase 초기화 실패: 로컬 모드 유지', e); db = null; }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user') || 'default_local_user';
        const isCloudSyncActive = !!db && urlParams.has('user');

        /* ==============================================================
           🎵 [오디오 시스템: R8/R23 순수 오디오 엔진 100% 완전 복원]
           ============================================================== */
        const AUDIO_FILES = { focus: './focus.mp3', short: './break.mp3', alarm: './alarm.mp3' };
        const alarmPlayer = new Audio();
        alarmPlayer.preload = 'auto';
        alarmPlayer.playsInline = true;
        alarmPlayer.setAttribute('playsinline', '');

        // 사파리 iOS 전용 Pre-activation (첫 터치/클릭 시 오디오 잠금 해제)
        let audioUnlocked = false;
        function unlockAudio() {
            if (audioUnlocked) return;
            try {
                if (!alarmPlayer.src) {
                    alarmPlayer.src = AUDIO_FILES.focus;
                }
                const p = alarmPlayer.play();
                if (p !== undefined) {
                    p.then(() => {
                        alarmPlayer.pause();
                        alarmPlayer.currentTime = 0;
                        audioUnlocked = true;
                    }).catch(() => {});
                }
            } catch (e) {}
        }
        ['pointerdown', 'touchstart', 'click'].forEach(evt => {
            document.addEventListener(evt, unlockAudio, { once: true, passive: true });
        });

        let soundGeneration = 0;
        let soundRequest = null;
        let fadeTimer = null;

        function stopAllSound() {
            soundGeneration++;
            soundRequest = null;
            clearInterval(fadeTimer);
            fadeTimer = null;
            try { 
                alarmPlayer.pause(); 
                alarmPlayer.currentTime = 0;
            } catch (e) {}
            alarmPlayer.loop = false;
            alarmPlayer.volume = 1;
        }

        // 0.8초(800ms) 부드러운 페이드아웃
        function fadeVolume(target, ms, generation) {
            clearInterval(fadeTimer);
            const start = alarmPlayer.volume;
            const t0 = Date.now();
            fadeTimer = setInterval(() => {
                if (generation !== soundGeneration) { clearInterval(fadeTimer); fadeTimer = null; return; }
                const p = Math.min(1, (Date.now() - t0) / ms);
                alarmPlayer.volume = Math.max(0, Math.min(1, start + (target - start) * p));
                if (p >= 1) { clearInterval(fadeTimer); fadeTimer = null; }
            }, 30);
        }

        function playSound(key, loop, volume) {
            if (key === 'alarm' && soundRequest && soundRequest.loop) return;
            stopAllSound();
            if (isMuted) return;
            
            const generation = soundGeneration;
            soundRequest = { key, loop: !!loop };
            alarmPlayer.onended = () => {
                if (generation === soundGeneration && !loop) soundRequest = null;
            };
            
            alarmPlayer.src = AUDIO_FILES[key];
            alarmPlayer.muted = false;
            alarmPlayer.loop = !!loop;
            
            const fadeIn = !!loop;
            alarmPlayer.volume = fadeIn ? 0 : volume;
            try {
                const p = alarmPlayer.play();
                if (p && p.catch) p.catch(() => {
                    if (generation === soundGeneration) soundRequest = null;
                });
            } catch (e) {
                if (generation === soundGeneration) soundRequest = null;
            }
            if (fadeIn) fadeVolume(volume, 2000, generation);
        }

        function stopAudioEngine() {
            if (soundRequest && soundRequest.loop && !isMuted) {
                const generation = soundGeneration;
                fadeVolume(0, 800, generation);
                setTimeout(() => { if (generation === soundGeneration) stopAllSound(); }, 800);
            } else {
                stopAllSound();
            }
        }

        function playEndAlert(mode) { playSound(mode === 'focus' ? 'focus' : 'short', true, 1); }
        function playHourlyAlert() { playSound('alarm', false, 0.65); }

        function unlockAudioEngine() {
            unlockAudio();
        }

        /* ==============================================================
           🌌 [COSMIC FX ENGINE: 5초~0초 절정 정점 & Break 탭 오로라 버그 수정]
           ============================================================== */
        const CosmicFX = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            dpr: 1,
            
            stage: 0,          // 0: 평상시(idle), 1: 15s~5s(빌드업), 2: 5s~0s(절정), 3: 완료 유지, 4: 복귀
            mode: 'focus',     // 'focus' | 'short'
            
            dimAlpha: 0,       // 0 -> 0.55
            nebulaAlpha: 0,    // 0 -> 0.55
            
            stars: [],
            maxStars: 60,
            
            stardust: [],      // 은하수 전용 미세 성간 먼지 파티클 복원
            
            meteors: [],
            meteorTimer: 0,
            meteorInterval: 8000,
            
            auroraPhase: 0,
            recoveryStartTime: 0,
            
            init() {
                this.canvas = document.getElementById('cosmic-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.handleResize();
                window.addEventListener('resize', () => this.handleResize());
                
                // [배경 별: 거대 원형 없이 조그맣고 은은한 핀포인트 점 (반지름 0.6px ~ 1.1px)]
                this.stars = [];
                for (let i = 0; i < 180; i++) {
                    this.stars.push({
                        x: Math.random(),
                        y: Math.random(),
                        size: Math.random() * 0.5 + 0.6,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        phase: Math.random() * Math.PI * 2
                    });
                }
                
                // [Focus 은하수 미세 성간 먼지 파티클 140개 복원]
                this.stardust = [];
                const dustPalette = ['#ffffff', '#ffffff', '#f3e8ff', '#e9d5ff', '#d8b4fe'];
                for (let i = 0; i < 140; i++) {
                    const t = Math.random();
                    const spread = (Math.random() - 0.5) * (Math.random() - 0.5) * 140;
                    this.stardust.push({
                        t: t,
                        spread: spread,
                        size: Math.random() * 0.7 + 0.4,
                        color: dustPalette[Math.floor(Math.random() * dustPalette.length)],
                        alpha: Math.random() * 0.4 + 0.15,
                        twinkle: Math.random() * 0.02 + 0.008,
                        phase: Math.random() * Math.PI * 2
                    });
                }
                
                this.meteorTimer = performance.now();
                this.meteorInterval = Math.random() * 3500 + 7500;
                
                requestAnimationFrame((t) => this.loop(t));
            },
            
            handleResize() {
                this.dpr = Math.min(window.devicePixelRatio || 1, 2);
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width * this.dpr;
                this.canvas.height = this.height * this.dpr;
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.scale(this.dpr, this.dpr);
            },
            
            getMilkyWayPoint(t) {
                const p0 = { x: this.width * 0.18, y: -30 };
                const p1 = { x: this.width * 0.36, y: this.height * 0.35 };
                const p2 = { x: this.width * 0.64, y: this.height * 0.65 };
                const p3 = { x: this.width * 0.82, y: this.height + 30 };
                
                const u = 1 - t;
                const tt = t * t;
                const uu = u * u;
                return {
                    x: uu * u * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + tt * t * p3.x,
                    y: uu * u * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + tt * t * p3.y
                };
            },
            
            // [요청 반영: 15초~5초 완만한 빌드업 ➔ 5초~0초가 진짜 절정기!]
            updateState(timeRemaining, currentMode, isRunning) {
                if (!isRunning || currentMode === 'timer') {
                    if (this.stage !== 0 && this.stage !== 4) this.abort();
                    return;
                }
                
                this.mode = currentMode;
                
                if (timeRemaining <= 15 && timeRemaining > 5) {
                    // [1단계: 도입 및 빌드업 (15초 ~ 5초)]
                    if (this.stage !== 1) {
                        this.stage = 1;
                        this.meteorTimer = performance.now();
                        this.spawnMeteor(false);
                    }
                    const p1 = (15 - timeRemaining) / 10; // 0.0 -> 1.0 (10초간 완만히 증가)
                    this.dimAlpha = p1 * 0.40;           // 0% -> 40%
                    this.nebulaAlpha = p1 * 0.42;        // 0% -> 42%
                    this.maxStars = Math.floor(60 + p1 * 50);
                    this.meteorInterval = 3200 - p1 * 2000; // 3.2초 -> 1.2초
                } else if (timeRemaining <= 5 && timeRemaining > 0) {
                    // [2단계: 절정기 (5초 ~ 0초)] - 딱 원하셨던 5초부터 진짜 절정 정점!
                    this.stage = 2;
                    const p2 = (5 - timeRemaining) / 5;   // 0.0 -> 1.0 (5초간 정점 도달)
                    this.dimAlpha = 0.40 + p2 * 0.15;     // 40% -> 55%
                    this.nebulaAlpha = 0.42 + p2 * 0.13;  // 42% -> 55%
                    this.maxStars = Math.floor(110 + p2 * 70); // 110 -> 180개
                    this.meteorInterval = Math.max(240, 1000 - p2 * 760); // 1.0초 -> 0.24초로 빗발치는 유성우!
                } else if (timeRemaining <= 0 && this.stage >= 1) {
                    // [3단계: 0초 완료 팝업 유지기]
                    this.stage = 3;
                    this.dimAlpha = 0.55;
                    this.nebulaAlpha = 0.55;
                    this.maxStars = 180;
                    this.meteorInterval = 250;
                }
            },
            
            // [Break 탭 전환 및 리셋 시 오로라가 튀어나오지 않도록 0초 즉시 초기화]
            forceInstantReset() {
                this.stage = 0;
                this.dimAlpha = 0;
                this.nebulaAlpha = 0;
                this.maxStars = 60;
                this.meteors = [];
                this.meteorTimer = performance.now();
                this.meteorInterval = Math.random() * 3500 + 7500;
            },
            
            dismiss() {
                if (this.stage === 0) return;
                this.stage = 4;
                this.recoveryStartTime = Date.now();
            },
            
            abort() {
                if (this.stage !== 0 && this.stage !== 4) {
                    this.dismiss();
                }
            },
            
            // [별똥별 생성: 90%는 좌상단 -> 우하향, 10%는 다방향]
            spawnMeteor(forceNormal = false) {
                const len = Math.random() * 55 + 70;
                const isDiverse = !forceNormal && (this.stage > 0) && (Math.random() < 0.10);
                
                let startX, startY, angle, speed;
                
                if (!isDiverse) {
                    // 90% (및 평상시 100%): [좌상단 -> 우하향] (약 35° ~ 46°)
                    startX = Math.random() * (this.width * 0.75) - (this.width * 0.15);
                    startY = Math.random() * (this.height * 0.35) - 40;
                    angle = (Math.PI / 180) * (Math.random() * 11 + 35);
                    speed = Math.random() * 4.5 + 9.5;
                } else {
                    // 10% (다방향 사선)
                    startX = Math.random() * (this.width * 0.8) + (this.width * 0.3);
                    startY = Math.random() * (this.height * 0.35) - 40;
                    angle = (Math.PI / 180) * (Math.random() * 14 + 132);
                    speed = Math.random() * 4 + 8.5;
                }
                
                this.meteors.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    len: len,
                    alpha: 0.9,
                    width: Math.random() * 0.5 + 1.15
                });
            },
            
            loop(now) {
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.auroraPhase += 0.009;
                
                // [4단계: 복귀기 3.5초간 서서히 소멸]
                if (this.stage === 4) {
                    const elapsed = Date.now() - this.recoveryStartTime;
                    const duration = 3500;
                    if (elapsed >= duration) {
                        this.stage = 0;
                        this.dimAlpha = 0;
                        this.nebulaAlpha = 0;
                        this.maxStars = 60;
                        this.meteors = [];
                        this.meteorTimer = now;
                        this.meteorInterval = Math.random() * 3500 + 7500;
                    } else {
                        const factor = 1 - (elapsed / duration);
                        this.dimAlpha = 0.55 * factor;
                        this.nebulaAlpha = 0.55 * factor;
                        this.maxStars = Math.floor(60 + 120 * factor);
                    }
                }
                
                // 1. 아늑한 암전 레이어
                if (this.dimAlpha > 0.005) {
                    this.ctx.save();
                    this.ctx.fillStyle = (this.mode === 'focus') 
                        ? `rgba(6, 11, 23, ${this.dimAlpha})` 
                        : `rgba(4, 14, 24, ${this.dimAlpha})`;
                    this.ctx.fillRect(0, 0, this.width, this.height);
                    this.ctx.restore();
                }
                
                // 2. 대형 우주 오브젝트 드로잉
                if (this.nebulaAlpha > 0.005) {
                    if (this.mode === 'focus') {
                        this.drawMilkyWaySubtle(this.nebulaAlpha);
                    } else {
                        this.drawAuroraSeamless(this.nebulaAlpha);
                    }
                }
                
                // 3. 조그맣고 은은한 별 드로잉
                this.drawStars();
                
                // 4. 별똥별 제어: 평상시 1줄기 vs 5초 절정 시 쏟아지는 유성우 (Focus/Break 동일)
                if (this.stage === 0) {
                    if (now - this.meteorTimer > this.meteorInterval) {
                        this.meteorTimer = now;
                        this.meteorInterval = Math.random() * 3500 + 7500;
                        this.spawnMeteor(true);
                    }
                } else if (this.stage >= 1 && this.stage <= 3) {
                    if (now - this.meteorTimer > this.meteorInterval) {
                        this.meteorTimer = now;
                        this.spawnMeteor(false);
                        // 5초 미만(절정기)에는 45% 확률로 2줄기 동시 출현
                        if (this.stage >= 2 && Math.random() < 0.45) {
                            setTimeout(() => this.spawnMeteor(false), 80);
                        }
                    }
                }
                this.drawMeteors();
                
                requestAnimationFrame((t) => this.loop(t));
            },
            
            /* [Focus 모드: 은하수 성운 구름 & 미세 성간 먼지 복원] */
            drawMilkyWaySubtle(alpha) {
                this.ctx.save();
                this.ctx.globalCompositeOperation = 'screen';
                
                const steps = 16;
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const pt = this.getMilkyWayPoint(t);
                    const rad = Math.min(this.width, this.height) * 0.44;
                    
                    const g = this.ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, rad);
                    g.addColorStop(0, `rgba(238, 215, 255, ${alpha * 0.22})`);
                    g.addColorStop(0.35, `rgba(180, 140, 255, ${alpha * 0.16})`);
                    g.addColorStop(0.70, `rgba(110, 105, 250, ${alpha * 0.08})`);
                    g.addColorStop(1, 'rgba(11, 20, 36, 0)');
                    
                    this.ctx.fillStyle = g;
                    this.ctx.beginPath();
                    this.ctx.arc(pt.x, pt.y, rad, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                
                // 은하수 성간 먼지 파티클
                this.stardust.forEach(sd => {
                    sd.phase += sd.twinkle;
                    const pt = this.getMilkyWayPoint(sd.t);
                    const px = pt.x + sd.spread;
                    const py = pt.y - sd.spread * 0.3;
                    
                    const curAlpha = alpha * sd.alpha * (0.65 + Math.sin(sd.phase) * 0.35);
                    this.ctx.fillStyle = sd.color;
                    this.ctx.globalAlpha = Math.max(0, Math.min(1, curAlpha));
                    this.ctx.beginPath();
                    this.ctx.arc(px, py, sd.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                this.ctx.restore();
            },
            
            /* [Break 모드: 경계선 없는 푸른빛 단일 실크 덩어리 오로라] */
            drawAuroraSeamless(alpha) {
                this.ctx.save();
                this.ctx.globalCompositeOperation = 'screen';
                
                const ribbons = [
                    { yFactor: 0.30, amp: 38, speed: 0.6, r: 56, g: 189, b: 248, a: 0.24 },
                    { yFactor: 0.36, amp: 46, speed: 0.8, r: 45, g: 212, b: 191, a: 0.28 },
                    { yFactor: 0.42, amp: 40, speed: 0.5, r: 99, g: 102, b: 241, a: 0.18 }
                ];
                
                ribbons.forEach(rb => {
                    const baseY = this.height * rb.yFactor;
                    
                    for (let x = -40; x <= this.width + 40; x += 60) {
                        const curY = baseY + 
                            Math.sin(x * 0.003 + this.auroraPhase * rb.speed) * rb.amp +
                            Math.sin(x * 0.006 - this.auroraPhase * 0.4) * (rb.amp * 0.35);
                        
                        const radX = 140;
                        const radY = 90;
                        
                        this.ctx.save();
                        this.ctx.translate(x, curY);
                        this.ctx.scale(1, radY / radX);
                        
                        const g = this.ctx.createRadialGradient(0, 0, 0, 0, 0, radX);
                        g.addColorStop(0, `rgba(${rb.r}, ${rb.g}, ${rb.b}, ${alpha * rb.a})`);
                        g.addColorStop(0.5, `rgba(${rb.r}, ${rb.g}, ${rb.b}, ${alpha * rb.a * 0.45})`);
                        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        
                        this.ctx.fillStyle = g;
                        this.ctx.beginPath();
                        this.ctx.arc(0, 0, radX, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.restore();
                    }
                });
                
                this.ctx.restore();
            },
            
            /* [배경 별: 거대 원형 없이 조그맣고 은은한 점(0.6~1.1px)으로만 투명도 호흡] */
            drawStars() {
                const count = Math.min(this.maxStars, this.stars.length);
                for (let i = 0; i < count; i++) {
                    const s = this.stars[i];
                    s.phase += s.twinkleSpeed;
                    const twinkle = (Math.sin(s.phase) + 1) * 0.5; // 0 ~ 1
                    const currentAlpha = 0.18 + twinkle * 0.65;   // 크기 변화 없이 투명도만 부드럽게 반짝임

                    this.ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
                    this.ctx.beginPath();
                    this.ctx.arc(s.x * this.width, s.y * this.height, s.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            },
            
            drawMeteors() {
                for (let i = this.meteors.length - 1; i >= 0; i--) {
                    const m = this.meteors[i];
                    m.x += m.vx;
                    m.y += m.vy;
                    
                    if (this.stage === 4) {
                        m.alpha *= 0.94;
                    }
                    
                    const tailX = m.x - (m.vx / Math.hypot(m.vx, m.vy)) * m.len;
                    const tailY = m.y - (m.vy / Math.hypot(m.vx, m.vy)) * m.len;
                    
                    const g = this.ctx.createLinearGradient(tailX, tailY, m.x, m.y);
                    g.addColorStop(0, 'rgba(255, 255, 255, 0)');
                    g.addColorStop(0.75, `rgba(255, 255, 255, ${m.alpha * 0.35})`);
                    g.addColorStop(1, `rgba(255, 255, 255, ${m.alpha * 0.85})`);
                    
                    this.ctx.save();
                    this.ctx.strokeStyle = g;
                    this.ctx.lineWidth = m.width;
                    this.ctx.lineCap = 'round';
                    this.ctx.beginPath();
                    this.ctx.moveTo(tailX, tailY);
                    this.ctx.lineTo(m.x, m.y);
                    this.ctx.stroke();
                    this.ctx.restore();
                    
                    if (m.x < -120 || m.x > this.width + 120 || m.y > this.height + 120 || m.alpha <= 0.02) {
                        this.meteors.splice(i, 1);
                    }
                }
            }
        };

        const HARD_DEFAULTS = {
            focus: { min: 25, sec: 0 },
            short: { min: 5, sec: 0 }
        };

        function getInitialModeSettings() {
            let isSavePermanent = false; 
            try { isSavePermanent = localStorage.getItem(`potato-save-default-${userId}`) === 'true'; } catch (e) {}
            if (isSavePermanent) {
                try {
                    const saved = localStorage.getItem(`potato-timer-presets-${userId}`);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.focus && parsed.short) return parsed;
                    }
                } catch(e) {}
            }
            return JSON.parse(JSON.stringify(HARD_DEFAULTS));
        }

        let modeSettings = getInitialModeSettings();
        let targetCycleGoal = 10; 
        try { targetCycleGoal = parseInt(localStorage.getItem(`potato-target-goal-${userId}`), 10) || 10; } catch (e) {}

        let tabStates = {
            focus: { timeRemaining: modeSettings.focus.min * 60 + modeSettings.focus.sec, totalSeconds: modeSettings.focus.min * 60 + modeSettings.focus.sec, isRunning: false },
            short: { timeRemaining: modeSettings.short.min * 60 + modeSettings.short.sec, totalSeconds: modeSettings.short.min * 60 + modeSettings.short.sec, isRunning: false },
            timer: { timeRemaining: 0, totalSeconds: 0, isRunning: false }
        };
        
        let currentMode = 'focus'; 
        let timerAnimationId = null;
        let lastTimestamp = null;
        let bgTimestamp = null;
        
        const totalLength = 345.57; 

        let pomoStars = 0; 
        try { pomoStars = parseInt(localStorage.getItem(`potato-pomo-stars-${userId}`), 10) || 0; } catch (e) {}
        let pomoCycleCount = 0; 
        try { pomoCycleCount = parseInt(localStorage.getItem(`potato-pomo-cycles-${userId}`), 10) || 0; } catch (e) {}
        
        let storedAutoPomo = null; 
        try { storedAutoPomo = localStorage.getItem(`potato-auto-pomo-${userId}`); } catch (e) {}
        let isAutoPomo = storedAutoPomo === 'true'; 

        let lastActiveTime = Date.now(); 
        try { lastActiveTime = parseInt(localStorage.getItem(`potato-last-active-${userId}`), 10) || Date.now(); } catch (e) {}
        let actualFocusSecondsCompleted = 0; 
        let lastCompletedMode = 'focus'; 

        function updateLastActive() {
            lastActiveTime = Date.now();
            try { localStorage.setItem(`potato-last-active-${userId}`, lastActiveTime.toString()); } catch (e) {}
        }

        const timeText = document.getElementById('time-text');
        const progressCircle = document.getElementById('progress');
        const startBtn = document.getElementById('start-btn');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const todoDrawer = document.getElementById('todo-drawer');
        const todoToggleBtn = document.getElementById('todo-toggle-btn');
        const todoListEl = document.getElementById('todo-list');
        const customAlert = document.getElementById('custom-alert');
        const customAlertBox = document.getElementById('custom-alert-box');
        const customAlertMsg = document.getElementById('custom-alert-msg');
        const statsDateEl = document.getElementById('stats-date-string');
        const statsCounterEl = document.getElementById('stats-counter-string');
        const fsIcon = document.getElementById('fs-icon');
        const mainContentBox = document.getElementById('main-content-box');
        const muteIcon = document.getElementById('mute-icon');
        const settingsModal = document.getElementById('settings-modal');
        const statsModal = document.getElementById('stats-modal');
        const pomoStarsBox = document.getElementById('pomo-stars-box');
        const pomoCycleCounter = document.getElementById('pomo-cycle-counter');
        const pomoAutoSwitch = document.getElementById('pomo-auto-switch');
        const chartTooltip = document.getElementById('chart-tooltip');

        let isTooltipPinned = false;

        /* [음소거 로직: 음소거 락 해제 및 기본 사운드 출력 보장] */
        let isMuted = false;
        try { localStorage.removeItem(`potato-muted-${userId}`); } catch (e) {}

        const ICON_SOUND_ON = `
            <g transform="translate(1, 0)">
                <path d="M11 5L6 9H3v6h3l5 4V5z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M15.5 8.5c1 1 1 3.5 0 5M18.5 6c2.5 2.5 2.5 7.5 0 10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            </g>
        `;
        const ICON_SOUND_MUTED = `
            <g transform="translate(4.5, 0)">
                <path d="M11 5L6 9H3v6h3l5 4V5z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
                <line x1="1" y1="5" x2="13.5" y2="19" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
            </g>
        `;

        function updateMuteDisplay() {
            if (isMuted) stopAllSound();
            muteIcon.innerHTML = isMuted ? ICON_SOUND_MUTED : ICON_SOUND_ON;
            document.getElementById('mute-toggle-btn').title = isMuted ? "소리 켜기" : "소리 끄기 (음소거)";
            alarmPlayer.muted = isMuted;
        }

        function toggleMute() {
            unlockAudio();
            updateLastActive();
            isMuted = !isMuted;
            try { localStorage.setItem(`potato-muted-${userId}`, isMuted.toString()); } catch (e) {}
            updateMuteDisplay();
        }

        /* [뽀모도로 트래커] */
        function renderPomoTracker() {
            pomoStarsBox.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const isFilled = i < pomoStars;
                const starSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                starSvg.setAttribute("viewBox", "0 0 24 24");
                starSvg.setAttribute("class", `pomo-star-icon ${isFilled ? 'filled' : ''}`);

                if (isFilled) {
                    starSvg.innerHTML = `
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" 
                            fill="#ffd700" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
                    `;
                } else {
                    starSvg.innerHTML = `
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" 
                            fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" stroke-linejoin="round"/>
                    `;
                }
                pomoStarsBox.appendChild(starSvg);
            }

            pomoCycleCounter.textContent = `${pomoCycleCount}/${targetCycleGoal}`;
            if (pomoCycleCount >= targetCycleGoal) {
                pomoCycleCounter.classList.add('max-achieved');
            } else {
                pomoCycleCounter.classList.remove('max-achieved');
            }

            if (isAutoPomo) {
                pomoAutoSwitch.classList.add('active');
            } else {
                pomoAutoSwitch.classList.remove('active');
            }
        }

        function toggleAutoPomo() {
            updateLastActive();
            isAutoPomo = !isAutoPomo;
            localStorage.setItem(`potato-auto-pomo-${userId}`, isAutoPomo.toString());
            renderPomoTracker();
        }

        function savePomoState() {
            localStorage.setItem(`potato-pomo-stars-${userId}`, pomoStars.toString());
            localStorage.setItem(`potato-pomo-cycles-${userId}`, pomoCycleCount.toString());
            localStorage.setItem(`potato-auto-pomo-${userId}`, isAutoPomo.toString());
            localStorage.setItem(`potato-target-goal-${userId}`, targetCycleGoal.toString());
            saveState();
        }

        /* [시간 조절 핸들러] */
        function setupAdjustButton(btnId, deltaAmount) {
            const btn = document.getElementById(btnId);
            let holdTimer = null;
            let repeatInterval = null;

            function triggerAdjust(e) {
                if (e) e.preventDefault();
                updateLastActive();
                adjustTime(deltaAmount);
            }

            btn.addEventListener('pointerdown', (e) => {
                triggerAdjust(e);
                clearTimeout(holdTimer);
                clearInterval(repeatInterval);

                holdTimer = setTimeout(() => {
                    repeatInterval = setInterval(() => {
                        adjustTime(deltaAmount);
                    }, 120);
                }, 320);
            });

            function stopRepeat() {
                clearTimeout(holdTimer);
                clearInterval(repeatInterval);
            }

            btn.addEventListener('pointerup', stopRepeat);
            btn.addEventListener('pointerleave', stopRepeat);
            btn.addEventListener('pointercancel', stopRepeat);
        }

        setupAdjustButton('btn-adjust-minus', -1);
        setupAdjustButton('btn-adjust-plus', 1);

        function adjustLayoutScale() {
            const baseW = 480;
            const baseH = 650;
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const scaleFactor = Math.min(1, (winW - 20) / baseW, (winH - 80) / baseH);
            mainContentBox.style.transform = `scale(${Math.max(0.68, scaleFactor)})`;
        }
        window.addEventListener('resize', adjustLayoutScale);

        function safeGetJSON(key, fallback) {
            try {
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        let todos = safeGetJSON(`potato-todos-${userId}`, []);
        let accumulatedFocusSeconds = parseFloat(localStorage.getItem(`potato-focus-seconds-${userId}`)) || 0;
        let lastSavedDate = localStorage.getItem(`potato-last-date-${userId}`) || "";
        let activeDayKey = localStorage.getItem(`potato-active-day-${userId}`) || '';
        let focusSessionTarget = null;
        const CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
        let lastServerTs = parseInt(localStorage.getItem(`potato-server-ts-${userId}`), 10) || 0;
        const DAY_RESET_HOUR = 5;
        const IDLE_RESET_MS = 2 * 60 * 60 * 1000;
        let isSyncingFromCloud = false;

        let focusHistory = safeGetJSON(`potato-history-${userId}`, {});

        function saveState() {
            localStorage.setItem(`potato-todos-${userId}`, JSON.stringify(todos));
            localStorage.setItem(`potato-focus-seconds-${userId}`, accumulatedFocusSeconds.toString());
            localStorage.setItem(`potato-last-date-${userId}`, lastSavedDate);
            localStorage.setItem(`potato-active-day-${userId}`, activeDayKey);
            localStorage.setItem(`potato-history-${userId}`, JSON.stringify(focusHistory));

            if (isCloudSyncActive && db && !isSyncingFromCloud) {
                db.collection("users").doc(userId).set({
                    todos: todos,
                    accumulatedFocusSeconds: accumulatedFocusSeconds,
                    lastSavedDate: lastSavedDate,
                    activeDayKey: activeDayKey,
                    pomoStars: pomoStars,
                    pomoCycleCount: pomoCycleCount,
                    targetCycleGoal: targetCycleGoal,
                    modeSettings: modeSettings,
                    isMuted: isMuted,
                    isAutoPomo: isAutoPomo,
                    focusHistory: focusHistory,
                    writerId: CLIENT_ID,
                    updatedAt: Date.now(),
                    updatedAtServer: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(err => console.error("Firestore Save Error:", err));
            }
        }

        function initCloudSync() {
            if (!isCloudSyncActive || !db) return;

            db.collection("users").doc(userId).onSnapshot((doc) => {
                if (!doc.exists) return;
                if (doc.metadata.hasPendingWrites) return;
                const data = doc.data();
                const ts = (data.updatedAtServer && data.updatedAtServer.toMillis) ? data.updatedAtServer.toMillis() : 0;
                if (ts) {
                    if (ts <= lastServerTs) return;
                    lastServerTs = ts;
                    localStorage.setItem(`potato-server-ts-${userId}`, String(ts));
                }
                if (data.writerId === CLIENT_ID) return;

                isSyncingFromCloud = true;
                if (data.todos) todos = data.todos;
                if (typeof data.accumulatedFocusSeconds === 'number') accumulatedFocusSeconds = data.accumulatedFocusSeconds;
                if (data.lastSavedDate) lastSavedDate = data.lastSavedDate;
                if (data.activeDayKey) activeDayKey = data.activeDayKey;
                if (typeof data.pomoStars === 'number') pomoStars = data.pomoStars;
                if (typeof data.pomoCycleCount === 'number') pomoCycleCount = data.pomoCycleCount;
                if (typeof data.targetCycleGoal === 'number') targetCycleGoal = data.targetCycleGoal;
                if (data.focusHistory) focusHistory = data.focusHistory;
                if (data.modeSettings && data.modeSettings.focus && data.modeSettings.short) {
                    modeSettings = data.modeSettings;
                    ['focus', 'short'].forEach(m => {
                        if (!tabStates[m].isRunning) {
                            tabStates[m].totalSeconds = modeSettings[m].min * 60 + modeSettings[m].sec;
                            tabStates[m].timeRemaining = tabStates[m].totalSeconds;
                        }
                    });
                }
                if (typeof data.isMuted === 'boolean') {
                    isMuted = data.isMuted;
                    localStorage.setItem(`potato-muted-${userId}`, isMuted.toString());
                    updateMuteDisplay();
                }
                if (typeof data.isAutoPomo === 'boolean') {
                    isAutoPomo = data.isAutoPomo;
                    localStorage.setItem(`potato-auto-pomo-${userId}`, isAutoPomo.toString());
                }

                localStorage.setItem(`potato-todos-${userId}`, JSON.stringify(todos));
                localStorage.setItem(`potato-focus-seconds-${userId}`, accumulatedFocusSeconds.toString());
                localStorage.setItem(`potato-last-date-${userId}`, lastSavedDate);
                localStorage.setItem(`potato-active-day-${userId}`, activeDayKey);
                localStorage.setItem(`potato-pomo-stars-${userId}`, pomoStars.toString());
                localStorage.setItem(`potato-pomo-cycles-${userId}`, pomoCycleCount.toString());
                localStorage.setItem(`potato-target-goal-${userId}`, targetCycleGoal.toString());
                localStorage.setItem(`potato-history-${userId}`, JSON.stringify(focusHistory));

                if (activeDayKey) statsDateEl.textContent = getFormattedDate(keyToDate(activeDayKey));
                renderTodos();
                updateStatsDisplay();
                renderPomoTracker();
                updateDisplay();
                isSyncingFromCloud = false;
            }, (err) => console.error("Firestore Listen Error:", err));
        }

        function getFormattedDate(d = new Date()) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        }

        function getDateKey(d = new Date()) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function keyToDate(key) {
            const p = String(key).split('-').map(Number);
            return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
        }

        function performDayRollover(dateObj) {
            const newKey = getDateKey(dateObj);
            if (activeDayKey === newKey) return false;
            activeDayKey = newKey;
            lastSavedDate = getFormattedDate(dateObj);
            statsDateEl.textContent = lastSavedDate;
            todos = todos.filter(t => !t.completed);
            accumulatedFocusSeconds = 0;
            pomoStars = 0;
            pomoCycleCount = 0;
            savePomoState();
            renderTodos();
            renderPomoTracker();
            updateStatsDisplay();
            return true;
        }

        function checkDayRollover() {
            const now = new Date();
            const todayKey = getDateKey(now);
            if (activeDayKey === todayKey || activeDayKey > todayKey) return;
            const isAnyRunning = tabStates.focus.isRunning || tabStates.short.isRunning || tabStates.timer.isRunning;
            const forced = now.getHours() >= DAY_RESET_HOUR;
            const idleOk = !isAnyRunning && (Date.now() - lastActiveTime) >= IDLE_RESET_MS;
            if (forced || idleOk) performDayRollover(now);
        }
        setInterval(checkDayRollover, 1000);

        let lastActivityMark = 0;
        ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(evt => {
            document.addEventListener(evt, () => {
                const t = Date.now();
                if (t - lastActivityMark > 1000) { lastActivityMark = t; updateLastActive(); }
            }, { capture: true, passive: true });
        });

        function updateStatsDisplay() {
            const focusMinutes = Math.floor(accumulatedFocusSeconds / 60);
            const label = `Today's Focus Time: ${focusMinutes} min`;
            if (statsCounterEl.textContent !== label) statsCounterEl.textContent = label;
        }

        function updateDisplay() {
            let state = tabStates[currentMode];
            const displaySecs = currentMode === 'timer' ? Math.floor(state.timeRemaining) : Math.ceil(state.timeRemaining);
            const minutes = Math.floor(displaySecs / 60);
            const seconds = displaySecs % 60;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            if (timeText.textContent !== timeStr) timeText.textContent = timeStr;
            
            if (currentMode === 'timer') {
                progressCircle.style.strokeDashoffset = '0';
                progressCircle.__lastDash = null; progressCircle.__lastOff = null;
                const cycleIndex = Math.floor(displaySecs / 3600);
                const progressRatio = (displaySecs % 3600) / 3600;
                
                if (cycleIndex % 2 === 0) { 
                    const emptyLen = progressRatio * totalLength;
                    const fillLen = totalLength - emptyLen;
                    progressCircle.style.strokeDasharray = `0 ${emptyLen} ${fillLen} ${totalLength}`;
                } else { 
                    const fillLen = progressRatio * totalLength;
                    progressCircle.style.strokeDasharray = `${fillLen} ${totalLength}`;
                }
            } else {
                const offset = totalLength - (state.timeRemaining / (state.totalSeconds || 1)) * totalLength;
                const offStr = (isNaN(offset) ? 0 : offset).toFixed(2);
                if (progressCircle.__lastDash !== 'full') { progressCircle.style.strokeDasharray = `${totalLength} ${totalLength}`; progressCircle.__lastDash = 'full'; }
                if (progressCircle.__lastOff !== offStr) { progressCircle.style.strokeDashoffset = offStr; progressCircle.__lastOff = offStr; }
            }
        }

        function adjustTime(amount) {
            updateLastActive();
            if (currentMode === 'timer') return; 

            const delta = amount * 60;
            let state = tabStates[currentMode];

            if (delta < 0 && state.timeRemaining <= 10) {
                if (state.isRunning) {
                    state.timeRemaining = 0;
                    updateDisplay();
                    stopTimerWithAlert(currentMode);
                }
                return; 
            }
            state.timeRemaining += delta;
            if (state.timeRemaining > 999 * 60 + 59) state.timeRemaining = 999 * 60 + 59;
            if (state.timeRemaining < 0) state.timeRemaining = 0;
            
            state.totalSeconds = state.isRunning ? (state.totalSeconds + delta) : state.timeRemaining;
            if (state.totalSeconds < state.timeRemaining) state.totalSeconds = state.timeRemaining;
            
            if (state.timeRemaining > 15) {
                CosmicFX.abort();
            }
            
            updateDisplay();
        }

        let lastFocusSaveTime = 0;

        function recordFocusTime(seconds, atMs) {
            const dateKey = activeDayKey || getDateKey();
            const hour = new Date(atMs || Date.now()).getHours();

            if (!focusHistory[dateKey]) {
                focusHistory[dateKey] = {
                    totalSeconds: 0,
                    hourly: new Array(24).fill(0)
                };
            }

            focusHistory[dateKey].totalSeconds += seconds;
            focusHistory[dateKey].hourly[hour] = (focusHistory[dateKey].hourly[hour] || 0) + seconds;
        }

        function addFocusSeconds(seconds, endMs) {
            if (!(seconds > 0)) return;
            endMs = endMs || Date.now();
            const startMs = endMs - seconds * 1000;
            const b = new Date(endMs);
            b.setHours(DAY_RESET_HOUR, 0, 0, 0);
            const bMs = b.getTime();
            if (startMs < bMs && endMs >= bMs && activeDayKey && activeDayKey !== getDateKey(b)) {
                const pre = (bMs - startMs) / 1000;
                accumulatedFocusSeconds += pre;
                recordFocusTime(pre, bMs - 1);
                performDayRollover(b);
                const post = seconds - pre;
                accumulatedFocusSeconds += post;
                recordFocusTime(post, endMs);
            } else {
                accumulatedFocusSeconds += seconds;
                recordFocusTime(seconds, endMs);
            }
        }

        function advanceGeneralTimer(elapsed, endMs) {
            const st = tabStates.timer;
            const prevHour = Math.floor(st.timeRemaining / 3600);
            let eff = elapsed;
            if (st.timeRemaining + eff >= 59999) {
                eff = Math.max(0, 59999 - st.timeRemaining);
                st.isRunning = false;
                if (currentMode === 'timer') startBtn.textContent = 'START';
            }
            st.timeRemaining += eff;
            addFocusSeconds(eff, endMs);
            const curHour = Math.floor(st.timeRemaining / 3600);
            if (curHour > prevHour && curHour >= 1) playHourlyAlert();
        }

        const TICK_MS = 50;

        function timerLoop() {
            const now = Date.now();
            if (!lastTimestamp) lastTimestamp = now;
            let elapsedSeconds = (now - lastTimestamp) / 1000;
            lastTimestamp = now;

            let anyRunning = false;

            if (tabStates.focus.isRunning) {
                anyRunning = true;
                const consumed = Math.min(Math.max(0, elapsedSeconds), tabStates.focus.timeRemaining);
                tabStates.focus.timeRemaining = Math.max(0, tabStates.focus.timeRemaining - consumed);
                addFocusSeconds(consumed, now);
                actualFocusSecondsCompleted += consumed;

                // 15초 카운트다운 연출 실시간 동기화
                CosmicFX.updateState(tabStates.focus.timeRemaining, 'focus', true);

                if (tabStates.focus.timeRemaining <= 0) {
                    tabStates.focus.timeRemaining = 0;
                    stopTimerWithAlert('focus');
                }
            }

            if (tabStates.short.isRunning) {
                anyRunning = true;
                const consumed = Math.min(Math.max(0, elapsedSeconds), tabStates.short.timeRemaining);
                tabStates.short.timeRemaining = Math.max(0, tabStates.short.timeRemaining - consumed);

                // 15초 카운트다운 연출 실시간 동기화
                CosmicFX.updateState(tabStates.short.timeRemaining, 'short', true);

                if (tabStates.short.timeRemaining <= 0) {
                    tabStates.short.timeRemaining = 0;
                    stopTimerWithAlert('short');
                }
            }

            if (tabStates.timer.isRunning) {
                anyRunning = true;
                advanceGeneralTimer(elapsedSeconds, now);
            }
            updateStatsDisplay();
            if (now - lastFocusSaveTime > 10000) {
                lastFocusSaveTime = now;
                saveState();
            }
            updateDisplay();

            if (Object.values(tabStates).some(st => st.isRunning)) {
                timerAnimationId = setTimeout(timerLoop, TICK_MS);
            } else {
                timerAnimationId = null;
                lastTimestamp = null;
            }
        }

        function toggleTimer() {
            unlockAudio(); // START 클릭 시 오디오 권한 즉시 언락
            updateLastActive();
            let state = tabStates[currentMode];

            if (state.isRunning) {
                state.isRunning = false;
                startBtn.textContent = 'START';
                saveState();
                
                CosmicFX.abort();
                
                if (!tabStates.focus.isRunning && !tabStates.short.isRunning && !tabStates.timer.isRunning) {
                    if (timerAnimationId) clearTimeout(timerAnimationId);
                    timerAnimationId = null;
                }
            } else {
                if (currentMode !== 'timer' && state.timeRemaining <= 0) return;
                if (currentMode === 'timer' && state.timeRemaining >= 59999) return;
                
                if (currentMode === 'focus' && focusSessionTarget === null) {
                    focusSessionTarget = modeSettings.focus.min * 60 + modeSettings.focus.sec;
                }
                state.isRunning = true;
                startBtn.textContent = 'STOP';
                
                if (!timerAnimationId) {
                    lastTimestamp = Date.now();
                    timerAnimationId = setTimeout(timerLoop, TICK_MS);
                }
            }
        }

        function resetTimer() {
            updateLastActive();
            let state = tabStates[currentMode];
            state.isRunning = false;
            
            // 리셋 시 3.5초 지연 없이 0초 즉각 완전 초기화
            CosmicFX.forceInstantReset();
            
            if (currentMode === 'timer') {
                state.timeRemaining = 0;
                state.totalSeconds = 0;
            } else {
                const setting = modeSettings[currentMode];
                state.totalSeconds = setting.min * 60 + setting.sec;
                state.timeRemaining = state.totalSeconds;
            }
            
            actualFocusSecondsCompleted = 0; 
            if (currentMode === 'focus') focusSessionTarget = null;
            startBtn.textContent = 'START';
            
            if (!tabStates.focus.isRunning && !tabStates.short.isRunning && !tabStates.timer.isRunning) {
                if (timerAnimationId) clearTimeout(timerAnimationId);
                timerAnimationId = null;
                lastTimestamp = null;
                stopAudioEngine();
            }
            updateDisplay();
        }

        function setMode(mode) {
            unlockAudio();
            if (currentMode === 'focus' || currentMode === 'short') {
                tabStates[currentMode].isRunning = false;
            }

            // [핵심: 탭 전환 시 오로라/은하수가 잔상으로 번쩍이지 않도록 0초 즉각 완전 초기화]
            CosmicFX.forceInstantReset();

            currentMode = mode;
            tabButtons.forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + (mode === 'short' ? 'short' : mode)).classList.add('active'); 
            
            const btnMinus = document.getElementById('btn-adjust-minus');
            const btnPlus = document.getElementById('btn-adjust-plus');
            if (mode === 'timer') {
                btnMinus.style.visibility = 'hidden';
                btnPlus.style.visibility = 'hidden';
            } else {
                btnMinus.style.visibility = 'visible';
                btnPlus.style.visibility = 'visible';
            }
            
            startBtn.textContent = tabStates[currentMode].isRunning ? 'STOP' : 'START';

            if (!tabStates.focus.isRunning && !tabStates.short.isRunning && !tabStates.timer.isRunning) {
                if (timerAnimationId) clearTimeout(timerAnimationId);
                timerAnimationId = null;
                lastTimestamp = null;
            }

            updateDisplay(); 
        }

        function handleManualTabChange(mode) {
            updateLastActive();
            if (isAutoPomo) {
                isAutoPomo = false;
                localStorage.setItem(`potato-auto-pomo-${userId}`, 'false');
                renderPomoTracker();
            }
            setMode(mode);
        }

        /* [타이머 0초 완료 시: 알람 즉시 실행 및 고요한 축하 모드] */
        function stopTimerWithAlert(completedMode) {
            try { updateLastActive(); } catch (e) { console.warn('completion-activity', e); }
            tabStates[completedMode].isRunning = false;
            
            if (completedMode === currentMode) {
                startBtn.textContent = 'START';
            }
            
            if (!tabStates.focus.isRunning && !tabStates.short.isRunning && !tabStates.timer.isRunning) {
                if (timerAnimationId) clearTimeout(timerAnimationId);
                timerAnimationId = null;
            }
            
            updateDisplay();
            try { playEndAlert(completedMode); } catch (e) { console.error(e); }

                customAlertMsg.textContent = '시간이 다 되었습니다! 고생하셨어요 🎉';

                customAlertMsg.textContent = '이제 다시 시작해 볼까요? 💪🏻';
            }

        /* [완료 확인 버튼: 부드러운 4단계 복귀 및 0.8초 페이드아웃] */
        let isClosingAlert = false;
        function closeCustomAlert() {
            if (!customAlert.classList.contains('show') || isClosingAlert) return;
            isClosingAlert = true;
            
            customAlert.classList.remove('show');
            
            CosmicFX.dismiss();
            
            // 0.8초 볼륨 페이드아웃
            stopAudioEngine();
            try { updateLastActive(); } catch (e) {}

            try {
                if (lastCompletedMode === 'focus') {
                    const starTarget = (focusSessionTarget !== null) ? focusSessionTarget : (modeSettings.focus.min * 60 + modeSettings.focus.sec);
                    if (actualFocusSecondsCompleted >= Math.max(1, starTarget - 2)) {
                        if (pomoStars < 4) {
                            pomoStars++;
                        } else {
                            pomoStars = 1;
                        }

                        if (pomoStars === 4) {
                            pomoCycleCount++;
                        }
                        savePomoState();
                        renderPomoTracker();
                    }
                    actualFocusSecondsCompleted = 0; 
                    focusSessionTarget = null;
                }

                if (isAutoPomo) {
                    const nextMode = (lastCompletedMode === 'focus') ? 'short' : 'focus';
                    const setting = modeSettings[nextMode];
                    tabStates[nextMode].totalSeconds = setting.min * 60 + setting.sec;
                    tabStates[nextMode].timeRemaining = tabStates[nextMode].totalSeconds;
                    setMode(nextMode);
                    toggleTimer(); 
                } else {
                    let state = tabStates[lastCompletedMode];
                    const setting = modeSettings[lastCompletedMode];
                    if (setting) {
                        state.totalSeconds = setting.min * 60 + setting.sec;
                        state.timeRemaining = state.totalSeconds;
                    }
                    updateDisplay();
                }
            } catch (e) {}

            setTimeout(() => { isClosingAlert = false; }, 350);
        }

        function pauseFocusBreakForBackground() {
            const now = Date.now();
            ['focus', 'short'].forEach(m => {
                const st = tabStates[m];
                if (!st.isRunning) return;
                if (lastTimestamp) {
                    const e = Math.min(1, Math.max(0, (now - lastTimestamp) / 1000));
                    if (e > 0) {
                        st.timeRemaining = Math.max(0.001, st.timeRemaining - e);
                        if (m === 'focus') {
                            addFocusSeconds(e, now);
                            actualFocusSecondsCompleted += e;
                        }
                    }
                }
                st.isRunning = false;
            });
            if (currentMode === 'focus' || currentMode === 'short') startBtn.textContent = 'START';
            if (!tabStates.focus.isRunning && !tabStates.short.isRunning && !tabStates.timer.isRunning) {
                if (timerAnimationId) clearTimeout(timerAnimationId);
                timerAnimationId = null;
                lastTimestamp = null;
            }
            updateDisplay();
            updateStatsDisplay();
            saveState();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bgTimestamp = Date.now();
                pauseFocusBreakForBackground();
            } else {
                if (bgTimestamp) {
                    const bgElapsed = (Date.now() - bgTimestamp) / 1000;
                    bgTimestamp = null;
                    lastTimestamp = Date.now();
                    if (tabStates.timer.isRunning) {
                        advanceGeneralTimer(bgElapsed, Date.now());
                        if (!isSafariBrowser) {
                            const crossed = Math.floor(tabStates.timer.timeRemaining / 3600) - Math.floor((tabStates.timer.timeRemaining - bgElapsed) / 3600);
                            for (let i = 0; i < crossed; i++) playHourlyAlert();
                        }
                    }
                    updateDisplay();
                    updateStatsDisplay();
                    saveState();
                }
                checkDayRollover();
            }

        function formatMinutesToHours(min) {
            if (min >= 60) {
                const h = Math.floor(min / 60);

                return `${h}시간 ${m}분`;
            }
            return `${min}분`;

        function renderStatsDashboard() {
            const today = keyToDate(activeDayKey || getDateKey());
            const last30DaysKeys = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                last30DaysKeys.push(getDateKey(d));
            }

            let activeDaysCount = 0;
            let totalFocusSec30Days = 0;
            let hourlyTotals30Days = new Array(24).fill(0); 

            last30DaysKeys.forEach(dateKey => {
                const dayData = focusHistory[dateKey];
                if (dayData) {
                    const daySec = dayData.totalSeconds || 0;
                    if (daySec >= 300) {
                        activeDaysCount++;
                        totalFocusSec30Days += daySec;
                    }
                    const arr = dayData.hourly || [];
                    for (let h = 0; h < 24; h++) {
                        hourlyTotals30Days[h] += (arr[h] || 0);
                    }
                }
            });

            document.getElementById('stats-active-days-val').textContent = `${activeDaysCount}일`;
            const avgSec = activeDaysCount > 0 ? (totalFocusSec30Days / activeDaysCount) : 0;
            const avgMin = Math.floor(avgSec / 60);
            if (avgMin >= 60) {
                const h = Math.floor(avgMin / 60);
                const m = avgMin % 60;
                document.getElementById('stats-daily-avg-val').textContent = `${h}h ${m}m`;
            } else {
                document.getElementById('stats-daily-avg-val').textContent = `${avgMin}m`;
            }

            renderLineActivityChart();
            renderHourlyDistributionChart(hourlyTotals30Days);
        }

        function renderLineActivityChart() {
            const svg = document.getElementById('line-chart-svg');
            const axisLabelsContainer = document.getElementById('line-axis-labels-container');
            svg.innerHTML = '';
            axisLabelsContainer.innerHTML = '';

            const days = currentChartRange;
            const today = keyToDate(activeDayKey || getDateKey());
            const dateList = [];
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

            for (let i = days - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const m = d.getMonth() + 1;
                const dayNum = d.getDate();
                const w = weekdays[d.getDay()];
                dateList.push({
                    dateKey: getDateKey(d),
                    dayNumber: String(dayNum),
                    tooltipDateStr: `${m}/${dayNum}(${w})`
                });
            }

            let maxSeconds = 60;
            dateList.forEach(item => {
                const sec = (focusHistory[item.dateKey] && focusHistory[item.dateKey].totalSeconds) || 0;
                if (sec > maxSeconds) maxSeconds = sec;
            });

            const svgWidth = svg.clientWidth || 380;
            const svgHeight = 105;
            const padLeft = 14;
            const padRight = 14;
            const padTop = 15;
            const padBottom = 15;
            const chartW = svgWidth - padLeft - padRight;
            const chartH = svgHeight - padTop - padBottom;

            const points = dateList.map((item, idx) => {
                const sec = (focusHistory[item.dateKey] && focusHistory[item.dateKey].totalSeconds) || 0;
                const x = padLeft + (chartW / (days - 1)) * idx;
                const y = padTop + chartH - (sec / maxSeconds) * chartH;
                return { x, y, item, sec };
            });

            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            const linearGrad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
            linearGrad.setAttribute("id", "lineAreaGrad");
            linearGrad.setAttribute("x1", "0%");
            linearGrad.setAttribute("y1", "0%");
            linearGrad.setAttribute("x2", "0%");
            linearGrad.setAttribute("y2", "100%");

            const stop1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop1.setAttribute("offset", "0%");
            stop1.setAttribute("stop-color", "#6A55C9");
            stop1.setAttribute("stop-opacity", "0.38");

            const stop2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop2.setAttribute("offset", "100%");
            stop2.setAttribute("stop-color", "#6A55C9");
            stop2.setAttribute("stop-opacity", "0.0");

            linearGrad.appendChild(stop1);
            linearGrad.appendChild(stop2);
            defs.appendChild(linearGrad);
            svg.appendChild(defs);

            let lineD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                lineD += ` L ${points[i].x} ${points[i].y}`;
            }

            const bottomY = padTop + chartH;
            const areaD = `${lineD} L ${points[points.length - 1].x} ${bottomY} L ${points[0].x} ${bottomY} Z`;

            const areaEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
            areaEl.setAttribute("d", areaD);
            areaEl.setAttribute("fill", "url(#lineAreaGrad)");
            svg.appendChild(areaEl);

            const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathEl.setAttribute("d", lineD);
            pathEl.setAttribute("fill", "none");
            pathEl.setAttribute("stroke", "#6A55C9");
            pathEl.setAttribute("stroke-width", "2.8");
            pathEl.setAttribute("stroke-linejoin", "round");
            svg.appendChild(pathEl);

            points.forEach(pt => {
                const hitCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                hitCircle.setAttribute("cx", pt.x);
                hitCircle.setAttribute("cy", pt.y);
                hitCircle.setAttribute("r", "12");
                hitCircle.setAttribute("fill", "transparent");
                hitCircle.style.cursor = "pointer";

                const min = Math.floor(pt.sec / 60);
                const tooltipText = `${pt.item.tooltipDateStr}: ${formatMinutesToHours(min)}`;

                const triggerEvent = (e) => {
                    e.stopPropagation();
                    showTooltip(e, tooltipText);
                };

                hitCircle.addEventListener('mouseenter', (e) => showTooltip(e, tooltipText));
                hitCircle.addEventListener('mousemove', (e) => positionTooltip(e));
                hitCircle.addEventListener('click', triggerEvent);
                hitCircle.addEventListener('touchstart', triggerEvent);

                svg.appendChild(hitCircle);
            });

            if (days === 7) {
                points.forEach(pt => {
                    const span = document.createElement('span');
                    span.className = 'chart-axis-label-item';
                    span.textContent = pt.item.dayNumber;
                    span.style.left = `${(pt.x / svgWidth) * 100}%`;
                    axisLabelsContainer.appendChild(span);
                });
            } else {
                points.forEach((pt, idx) => {
                    if (idx % 5 === 0 || idx === points.length - 1) {
                        const span = document.createElement('span');
                        span.className = 'chart-axis-label-item';
                        span.textContent = pt.item.dayNumber;
                        span.style.left = `${(pt.x / svgWidth) * 100}%`;
                        axisLabelsContainer.appendChild(span);
                    }
                });
            }
        }

        function renderHourlyDistributionChart(hourlyTotals30Days) {
            const hourlyBox = document.getElementById('hourly-chart-box');

        }

        /* [커스텀 포인터 드래그 앤 드롭] */
        let draggedTodoId = null;
        let dragGhost = null;
        let offsetX = 0;
        let offsetY = 0;
        let dragPointerId = null;

        function handlePointerDown(e, id, itemEl) {
            if (dragGhost) return;
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();

            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'INPUT')) {
                activeEl.blur();
            }

            draggedTodoId = id;
            dragPointerId = e.pointerId;
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}

            const rect = itemEl.getBoundingClientRect();
            const clientX = e.clientX;
            const clientY = e.clientY;
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;

            itemEl.classList.add('is-placeholder');
            dragGhost = itemEl.cloneNode(true);
            dragGhost.classList.remove('is-placeholder');
            dragGhost.classList.add('is-dragging-ghost');
            dragGhost.style.width = `${rect.width}px`;
            dragGhost.style.height = `${rect.height}px`;
            dragGhost.style.left = `${clientX - offsetX}px`;
            dragGhost.style.top = `${clientY - offsetY}px`;
            document.body.appendChild(dragGhost);

            document.addEventListener('pointermove', handlePointerMove, { passive: false });
            document.addEventListener('pointerup', handlePointerUp);
            document.addEventListener('pointercancel', handlePointerUp);
        }

        function handlePointerMove(e) {
            if (!dragGhost || e.pointerId !== dragPointerId) return;
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            const clientX = e.clientX;
            const clientY = e.clientY;
            dragGhost.style.left = `${clientX - offsetX}px`;
            dragGhost.style.top = `${clientY - offsetY}px`;

            document.querySelectorAll('.todo-item').forEach(el => {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            });

            dragGhost.style.display = 'none';
            const targetEl = document.elementFromPoint(clientX, clientY);
            dragGhost.style.display = 'flex';

            const dropLi = targetEl ? targetEl.closest('.todo-item:not(.is-placeholder):not(.completed)') : null;
            if (dropLi) {
                const dropRect = dropLi.getBoundingClientRect();
                if (clientY < dropRect.top + dropRect.height / 2) {
                    dropLi.classList.add('drag-over-top');
                } else {
                    dropLi.classList.add('drag-over-bottom');
                }
            }
        }

        function handlePointerUp(e) {
            if (!dragGhost) return;
            if (e && e.pointerId !== undefined && e.pointerId !== dragPointerId) return;
            const cancelled = !!(e && e.type === 'pointercancel');

            dragGhost.remove();
            dragGhost = null;

            const overTop = document.querySelector('.todo-item.drag-over-top');
            const overBottom = document.querySelector('.todo-item.drag-over-bottom');
            let targetId = null;
            let position = null;

            if (!cancelled) {
                if (overTop) {
                    targetId = parseFloat(overTop.dataset.id);
                    position = 'before';
                } else if (overBottom) {
                    targetId = parseFloat(overBottom.dataset.id);
                    position = 'after';
                }
            }

            document.querySelectorAll('.todo-item').forEach(el => {
                el.classList.remove('drag-over-top', 'drag-over-bottom', 'is-placeholder', 'is-dragging');
            });

            if (targetId && draggedTodoId) {
                reorderTodosCustom(draggedTodoId, targetId, position);
            } else {
                renderTodos();
            }

            draggedTodoId = null;
            dragPointerId = null;
            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            document.removeEventListener('pointercancel', handlePointerUp);
        }

        function reorderTodosCustom(sourceId, targetId, position) {
            updateLastActive();
            const uncompleted = todos.filter(t => !t.completed).sort((a, b) => a.order - b.order);
            const sourceIdx = uncompleted.findIndex(t => t.id === sourceId);
            const targetIdx = uncompleted.findIndex(t => t.id === targetId);

            if (sourceIdx === -1 || targetIdx === -1) return;

            const [movedItem] = uncompleted.splice(sourceIdx, 1);
            let newTargetIdx = uncompleted.findIndex(t => t.id === targetId);

            if (position === 'after') {
                newTargetIdx++;
            }
            uncompleted.splice(newTargetIdx, 0, movedItem);

            uncompleted.forEach((item, index) => {
                item.order = index + 1;
            });

            saveState();
            renderTodos();
        }

            const isInsideDrawer = path.includes(todoDrawer) || todoDrawer.contains(event.target);

        });

        function handleTodoKeyDown(e) {
            if (e.isComposing) return;
            const isMobile = window.innerWidth <= 600; 
            
            if (e.key === 'Enter') {
                if (isMobile) {
                    setTimeout(() => autoResizeTextarea(e.target), 0);
                } else {
                    if (e.shiftKey) {
                        setTimeout(() => autoResizeTextarea(e.target), 0);
                    } else {
                        e.preventDefault();
                        addTodo();
                    }
                }
            }
        }

        function getSortedTodos() {
            const uncompleted = todos.filter(t => !t.completed).sort((a, b) => a.order - b.order);
            const completed = todos.filter(t => t.completed).sort((a, b) => (a.completedAt || 0) - (b.completedAt || 0));
            return [...uncompleted, ...completed];
        }

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';

            const sortedList = getSortedTodos();

            sortedList.forEach((todo) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.dataset.id = todo.id;

                const chk = document.createElement('input');
                chk.type = 'checkbox';
                chk.checked = !!todo.completed;
                chk.onchange = (e) => toggleTodo(todo.id, e);

                const span = document.createElement('span');
                span.className = 'todo-text';
                span.textContent = todo.text;

                const dragHandle = document.createElement('button');
                dragHandle.type = 'button';
                dragHandle.className = 'todo-drag-handle';
                dragHandle.title = '끌어서 순서 변경';
                dragHandle.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="7" x2="20" y2="7"/>
                        <line x1="4" y1="12" x2="20" y2="12"/>
                        <line x1="4" y1="17" x2="20" y2="17"/>
                    </svg>
                `;

                if (!todo.completed) {
                    dragHandle.addEventListener('pointerdown', (e) => handlePointerDown(e, todo.id, li));
                }

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'todo-del-btn';
                delBtn.title = '삭제';
                delBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="6" y1="6" x2="18" y2="18"/>
                        <line x1="18" y1="6" x2="6" y2="18"/>
                    </svg>
                `;
                delBtn.onclick = (e) => deleteTodo(todo.id, e);

                const actionWrap = document.createElement('div');
                actionWrap.className = 'todo-actions';
                
                if (!todo.completed) {
                    actionWrap.appendChild(dragHandle);
                }
                actionWrap.appendChild(delBtn);

                li.append(chk, span, actionWrap);
                list.appendChild(li);
            });
        }

        /* [모바일 투두 추가 시 자판 위치 고정 및 화면 울렁거림 방지] */
        function addTodo() {
            updateLastActive();
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;

            const maxOrder = todos.reduce((max, t) => Math.max(max, t.order || 0), 0);
            todos.push({
                id: Date.now() + Math.random(),
                text: text,
                completed: false,
                order: maxOrder + 1,
                completedAt: null
            });

            input.value = '';
            input.style.height = '38px';
            input.scrollTop = 0;

            if (document.activeElement !== input) {
                input.focus({ preventScroll: true });
            }

            saveState();
            renderTodos();
        }

        function toggleTodo(id, e) {
            updateLastActive();
            if (e) e.stopPropagation();
            const item = todos.find(t => t.id === id);
            if (!item) return;

            item.completed = !item.completed;
            item.completedAt = item.completed ? Date.now() : null;
            saveState();
            renderTodos();
        }

        function deleteTodo(id, e) {
            updateLastActive();
            if (e) e.stopPropagation();
            todos = todos.filter(t => t.id !== id);
            saveState();
            renderTodos();
        }

        /* [전체화면 제어: 홈 화면 PWA ↔ 일반 브라우저 아이콘 1:1 완벽 대응] */
        const ICON_ENTER_FULLSCREEN = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/>';
        const ICON_EXIT_FULLSCREEN = `
            <path d="M4 10h3.5a1.5 1.5 0 0 0 1.5-1.5V5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 10h-3.5a1.5 1.5 0 0 1-1.5-1.5V5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 14h3.5a1.5 1.5 0 0 1 1.5 1.5V19" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 14h-3.5a1.5 1.5 0 0 0-1.5 1.5V19" stroke-linecap="round" stroke-linejoin="round"/>
        `;

        const isTouchDevice = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (navigator.maxTouchPoints || 0) > 1;
        const isStandaloneApp = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        const isSafariBrowser = !isStandaloneApp && /Safari/i.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome|Chromium|Firefox|Edg\//i.test(navigator.userAgent);

        let isFullscreenActive = isStandaloneApp ? true : false;

        function setFullscreenState(active) {
            isFullscreenActive = active;
            if (isStandaloneApp) {
                if (active) {
                    document.documentElement.classList.remove('pseudo-fullscreen');
                    document.body.classList.remove('pseudo-fullscreen');
                    fsIcon.innerHTML = ICON_EXIT_FULLSCREEN;
                    document.getElementById('fullscreen-toggle-btn').title = "화면 축소";
                } else {
                    document.documentElement.classList.add('pseudo-fullscreen');
                    document.body.classList.add('pseudo-fullscreen');
                    fsIcon.innerHTML = ICON_ENTER_FULLSCREEN;
                    document.getElementById('fullscreen-toggle-btn').title = "전체화면";
                }
            } else {
                document.documentElement.classList.remove('pseudo-fullscreen');
                document.body.classList.remove('pseudo-fullscreen');
                fsIcon.innerHTML = ICON_ENTER_FULLSCREEN;
                document.getElementById('fullscreen-toggle-btn').title = "전체화면";
            }
            adjustLayoutScale();
        }

        function toggleFullScreen(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (isSafariBrowser) return; 
            try { updateLastActive(); } catch (err) {}
            isFullscreenActive = !isFullscreenActive;
            setFullscreenState(isFullscreenActive);
        }

        /* 핀치 및 더블탭 줌 방지 */
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
            document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
        });
        document.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        document.addEventListener('dblclick', (e) => {
            if (isTouchDevice) e.preventDefault();
        }, { passive: false });

        /* [초기 구동 & 우주 쇼 캔버스 활성화] */
        CosmicFX.init();
        if (!activeDayKey) activeDayKey = getDateKey(new Date(lastActiveTime));
        lastSavedDate = getFormattedDate(keyToDate(activeDayKey));
        statsDateEl.textContent = lastSavedDate;
        checkDayRollover();
        updateDisplay();
        renderTodos();
        initCloudSync();
        adjustLayoutScale();
        updateMuteDisplay();
        renderPomoTracker();
        setFullscreenState(isFullscreenActive);
    </script>
</body>
</html>
